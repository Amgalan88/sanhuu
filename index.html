<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2461">
  <meta name="description" content="Гэр бүлийн нийтийн данс — орлогыг 5 дансанд автоматаар хуваарилж, зарлагыг хялбар бүртгэнэ.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Бидний санхүү">
  <title>Бидний санхүү</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Холбоос хуваалцахад (Messenger, Facebook, Telegram…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Бидний санхүү">
  <meta property="og:title" content="Бидний санхүү 💑">
  <meta property="og:description" content="Гэр бүлийн нийтийн данс — орлогоо 5 дансанд хуваарилж, зарлагаа хамтдаа хөтөлье.">
  <meta property="og:image" content="https://raw.githubusercontent.com/Amgalan88/sanhuu/main/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Бидний санхүү — зоосон лого">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Бидний санхүү 💑">
  <meta name="twitter:description" content="Гэр бүлийн нийтийн данс — орлогоо 5 дансанд хуваарилж, зарлагаа хамтдаа хөтөлье.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/Amgalan88/sanhuu/main/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Сэдвийг эрт тавьж анивчихаас сэргийлнэ
    try { const t = localStorage.getItem('bidnii-sanhuu-theme'); if (t === 'light' || t === 'dark' || t === 'comfort') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="boot" class="boot" aria-live="polite">
    <img class="boot-coin" src="icons/coin.svg" alt="">
    <div class="logo">Бидний <span>санхүү</span></div>
  </div>

  <!-- ============ Нэвтрэх ============ -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <img class="login-coin" src="icons/coin.svg" alt="">
      <h1 class="logo big">Бидний <span>санхүү</span></h1>
      <p class="login-sub">Гэр бүлийн нийтийн данс</p>
      <div id="login-body"></div>
      <p id="login-error" class="login-error" role="alert"></p>
    </div>
  </section>

  <!-- ============ Апп ============ -->
  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" id="brand" href="./" aria-label="Нүүр хуудас"><img class="brand-coin" src="icons/coin.svg" alt=""> <span class="logo">Бидний <span>санхүү</span></span></a>
      <button id="who" class="who" type="button" aria-label="Хэрэглэгч"></button>
      <div class="month-nav">
        <button type="button" id="month-prev" class="icon-btn" aria-label="Өмнөх сар">‹</button>
        <select id="month-select" aria-label="Сар сонгох"></select>
        <button type="button" id="month-next" class="icon-btn" aria-label="Дараах сар">›</button>
      </div>
    </header>

    <div class="ticker-wrap"><button type="button" id="ticker" class="ticker" aria-live="polite" title="Дараагийн мессеж"></button></div>

    <main>
      <!-- Нүүр -->
      <section class="view" data-view="home">
        <section class="card span-all" id="overview" aria-label="Өрхийн данс ба хуримтлал"></section>

        <section class="card quick" id="quick" aria-label="Хурдан бүртгэл">
          <div class="seg kind" role="group" aria-label="Төрөл">
            <button type="button" data-kind="expense">➖ Зарлага</button>
            <button type="button" data-kind="income">➕ Орлого</button>
          </div>
          <label class="amount-wrap">
            <span id="amount-sign" class="sign neg" aria-hidden="true">−</span>
            <input id="amount" inputmode="numeric" autocomplete="off" placeholder="0" enterkeyhint="done" aria-label="Дүн">
            <span class="cur">₮</span>
          </label>
          <div class="chips" id="chips"></div>
          <div class="cats" id="cats" role="group" aria-label="Ангилал"></div>
          <button type="button" id="extra-toggle" class="extra-toggle"></button>
          <div class="extra" hidden>
            <input id="note" type="text" maxlength="200" placeholder="📝 Тайлбар (заавал биш)" enterkeyhint="done" autocomplete="off">
            <input id="date" type="date" aria-label="Огноо">
          </div>
          <button type="button" id="save" class="save"></button>
          <p id="preview" class="preview" aria-live="polite"></p>
        </section>

        <section class="card" id="summary"></section>
        <section class="card coins-card">
          <div class="card-head"><h2>🪙 Дансны овоо</h2><span class="hint">← чирж эргүүлнэ →</span></div>
          <div class="seg" id="coin-mode" style="margin-bottom:10px" role="group" aria-label="Овооны харагдац">
            <button type="button" data-coin-mode="total">🏦 Нийт хуримтлал</button>
            <button type="button" data-coin-mode="month">📅 Энэ сар</button>
          </div>
          <div id="coins" class="coins"></div>
        </section>
      </section>

      <!-- Амжилт -->
      <section class="view" data-view="ach">
        <section class="card span-all" id="achievements" aria-label="Бидний амжилтууд"></section>
      </section>

      <!-- Гүйлгээ -->
      <section class="view" data-view="tx">
        <section class="card" id="breakdown"></section>
        <section class="card" id="expenses"></section>
        <section class="card" id="incomes"></section>
      </section>

      <!-- Түүх -->
      <section class="view" data-view="history">
        <section class="card span-all" id="history"></section>
        <section class="card span-all" id="audit"></section>
      </section>

      <!-- Бусад -->
      <section class="view" data-view="more">
        <section class="card" id="profile"></section>
        <section class="card" id="notif-card"></section>
        <section class="card" id="theme-card">
          <h2>🎨 Харагдах байдал</h2>
          <div class="theme-pick" id="theme-seg" role="radiogroup" aria-label="Сэдэв">
            <button type="button" role="radio" data-theme-set="light"><span class="sw sw-light" aria-hidden="true"><i></i></span>Гэрэл</button>
            <button type="button" role="radio" data-theme-set="dark"><span class="sw sw-dark" aria-hidden="true"><i></i></span>Харанхуй</button>
            <button type="button" role="radio" data-theme-set="comfort"><span class="sw sw-comfort" aria-hidden="true"><i></i></span>Нүдэнд ээлтэй</button>
          </div>
          <p class="note">👁️ <b>Нүдэнд ээлтэй</b> — цэнхэр гэрэл багатай дулаан өнгө. Орой, унтахын өмнө ашиглахад тохиромжтой.</p>
        </section>
        <section class="card" id="rules"></section>
      </section>
    </main>

    <button type="button" id="fab" class="fab" aria-label="Шинэ бүртгэл">+</button>

    <!-- Амжилт нэмэх -->
    <dialog id="ach-sheet" class="sheet" aria-labelledby="ach-sheet-title">
      <form id="ach-form" novalidate>
        <div class="sheet-head">
          <h2 id="ach-sheet-title">🏆 Амжилт нэмэх</h2>
          <button type="button" class="icon-x" data-close aria-label="Хаах">✕</button>
        </div>
        <label class="photo-pick" id="photo-pick">
          <input type="file" id="ach-file" accept="image/*" hidden>
          <span class="ph-empty"><span>📷</span><b>Зураг сонгох</b><small>Камер эсвэл галерейгаас · заавал биш</small></span>
          <img id="ach-preview" alt="Сонгосон зураг" hidden>
        </label>
        <div class="emoji-pick" id="ach-emojis" role="group" aria-label="Эможи"></div>
        <input class="field" id="ach-title" maxlength="120" autocomplete="off" placeholder="Жишээ: Хадгаламж 1 сая хүрлээ! 🎉" aria-label="Гарчиг">
        <div class="extra">
          <input id="ach-note" type="text" maxlength="300" placeholder="📝 Тайлбар (заавал биш)" autocomplete="off">
          <input id="ach-date" type="date" aria-label="Огноо">
        </div>
        <button type="submit" id="ach-save" class="save">✨ Амжилт хадгалах</button>
      </form>
    </dialog>

    <!-- Бүтэн дэлгэцийн харагдац -->
    <dialog id="viewer" class="viewer" aria-label="Амжилтын зураг">
      <div class="vw-stage" id="vw-stage"></div>
      <div class="vw-top">
        <span class="vw-count" id="vw-count"></span>
        <div class="vw-actions">
          <button type="button" class="vw-btn vw-del" id="vw-del" aria-label="Устгах">🗑️</button>
          <button type="button" class="vw-btn" id="vw-close" aria-label="Хаах" autofocus>✕</button>
        </div>
      </div>
      <button type="button" class="vw-nav prev" id="vw-prev" aria-label="Өмнөх">‹</button>
      <button type="button" class="vw-nav next" id="vw-next" aria-label="Дараах">›</button>
      <div class="vw-info" id="vw-info"></div>
    </dialog>

    <nav class="tabbar" aria-label="Үндсэн цэс">
      <button type="button" data-go="home"><span>🏠</span>Нүүр</button>
      <button type="button" data-go="tx"><span>📋</span>Гүйлгээ</button>
      <button type="button" data-go="ach"><span>🏆</span>Амжилт</button>
      <button type="button" data-go="history"><span>📊</span>Түүх</button>
      <button type="button" data-go="more"><span>⚙️</span>Бусад</button>
    </nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
