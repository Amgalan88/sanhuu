<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2461">
  <title>Calm App Kit — жишээ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="kit.css">
  <script>
    // Сэдвийг эрт тавьж анивчихаас сэргийлнэ
    try { const t = localStorage.getItem('app-theme'); if (['light', 'dark', 'comfort'].includes(t)) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="demo.js"></script>
</head>
<body>
  <header class="topbar">
    <b style="font-family:Montserrat,sans-serif;font-size:17px">🪙 Миний апп</b>
    <div class="top-right">
      <!-- YouTube тоглуулагч: дээд мөрөнд, профайлын хажууд -->
      <div class="yt-mini" id="yt-mini">
        <div id="yt-frame" class="yt-frame"></div>
        <button id="music-btn" class="yt-tap" type="button" aria-label="Хөгжим"><span class="yt-badge" aria-hidden="true"></span></button>
      </div>
      <button id="who" class="who" type="button" aria-label="Хэрэглэгч"></button>
    </div>
  </header>

  <main>
    <div class="view">
      <section class="card" id="profile"></section>
      <section class="card">
        <h2>🎨 Харагдах байдал</h2>
        <div id="theme-box"></div>
        <h3>🌤️ Арын дэвсгэр</h3>
        <div class="backdrop-pick" id="backdrop-pick" role="radiogroup" aria-label="Арын дэвсгэр"></div>
      </section>
      <section class="card" id="music-card"></section>
      <section class="card">
        <h2>✨ Урамшуулал</h2>
        <div class="btn-row">
          <button type="button" class="btn" id="demo-toast">Toast</button>
          <button type="button" class="btn" id="demo-del">🗑️ Устгах</button>
          <button type="button" class="btn primary" id="demo-cel">🎉 Баяр</button>
        </div>
        <ul class="list" style="margin-top:12px">
          <li>Хүснэгтийн оронд — нимгэн зураастай жагсаалт</li>
          <li>Хэсгүүд хайрцаггүй, зайгаар тусгаарлагдана</li>
        </ul>
      </section>
    </div>
  </main>
</body>
</html>
