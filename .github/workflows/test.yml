name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # ubuntu-latest has Chrome. The add-entry test opens a mocked household with it.
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
